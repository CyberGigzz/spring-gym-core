# --- Database Configuration (Local H2) ---
# This is the in-memory database configuration
spring.datasource.url=jdbc:h2:mem:gymdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA & Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.sql-load-script-source=data.sql

# --- Actuator Configuration (Task 2) ---
# Expose health, prometheus, and info endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# --- Logging Configuration ---
# Set the logging level for your application
logging.level.com.gym.crm=DEBUG